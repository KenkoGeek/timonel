version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'KenkoGeek'
    assignees:
      - 'KenkoGeek'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'

  # Enable security updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
    reviewers:
      - 'KenkoGeek'
    assignees:
      - 'KenkoGeek'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'github-actions'
